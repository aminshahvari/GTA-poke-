<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#161a23">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Blindrise">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>Blindrise Poker Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="/style.css">
<style>html,body{padding-top:env(safe-area-inset-top,0px)}</style>
</head>
<body>
<div class="app">
<!-- Sign in / invite -->
<section id="auth" class="screen start-like" hidden>
  <canvas id="globe" width="900" height="900"></canvas>
  <div class="chip c3"><span>BLIND<br>RISE<em>♠ ♥ ♣ ♦</em></span></div>
  <div class="chip c2"><span>BLIND<br>RISE<em>♠ ♥ ♣ ♦</em></span></div>
  <div class="chip c1"><span>BLIND<br>RISE<em>♠ ♥ ♣ ♦</em></span></div>
  <div class="logo"><b>BLIND<span>RISE</span></b><span class="pill">POKER CLUB</span><small class="tagline">Every level, you rise.</small></div>
  <form class="glass" id="authForm"></form>
</section>

<!-- Lobby -->
<section id="lobby" class="screen" hidden>
  <div class="topbar">
    <div class="mini-logo">BLIND<span>RISE</span></div>
    <div class="spacer"></div>
    <div class="me-chip" id="meChip"></div>
  </div>
  <div class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="event" aria-selected="true">Home</button>
    <button role="tab" data-tab="board" aria-selected="false">Leaderboard</button>
    <button role="tab" data-tab="learn" aria-selected="false">Learn</button>
    <button role="tab" data-tab="biz" aria-selected="false" class="biz-tab">Business</button>
    <button role="tab" data-tab="director" aria-selected="false" id="dirTab" hidden>Director</button>
  </div>
  <div class="scroll" id="lobbyBody"><div class="empty">Connecting to the club…</div></div>
</section>

<!-- Table -->
<section id="game" class="screen" hidden>
  <div class="clock">
    <div class="lvl"><small>Level</small><b id="cLevel">1</b></div>
    <div class="blinds"><b id="cBlinds" class="num">100/200</b><small id="cNext" class="num">Next</small></div>
    <div class="time"><b id="cTime" class="num">20:00</b><small id="cTimeLbl">Time left</small></div>
  </div>
  <div class="stats num">
    <div><small id="tName">Table</small><b id="sPlayers">-</b></div>
    <div><small>Avg stack</small><b id="sAvg">-</b></div>
    <div><small>Your rank</small><b id="sPos">-</b></div>
    <div class="hdr-btns"><button class="menu-btn chat-btn" id="chatBtn" aria-label="Table chat">💬<i id="chatDot" hidden></i></button><button class="menu-btn" id="lobbyBtn">Lobby</button></div>
  </div>
  <div class="table-area" id="tableArea">
    <div class="felt"></div>
    <div class="center">
      <div class="pot num" id="pot"></div>
      <div class="board" id="board"></div>
      <div class="msg" id="msg"></div>
    </div>
    <div id="seats"></div>
    <div id="fx"></div>
    <div class="coachtip" id="coachTip" hidden></div>
  </div>
  <div class="chat-sheet" id="chatSheet" hidden>
    <div class="chat-head"><b>Table chat</b><span class="hdr-btns"><button class="menu-btn" id="throwBtn" type="button">🍅 Throw</button><button class="menu-btn" id="chatClose">Close</button></span></div>
    <div class="chat-log" id="chatLog"></div>
    <div class="chat-quick" id="chatQuick"></div>
    <form class="chat-form" id="chatForm"><input id="chatInput" maxlength="140" placeholder="Message the table" autocomplete="off" enterkeyhint="send"><button class="btn red" type="submit">Send</button></form>
    <p class="chat-note" id="chatNote"></p>
  </div>
  <div class="helper" id="helper" hidden></div>
  <div class="controls" id="controls"></div>
</section>
</div>
<div id="modalRoot"></div>
<div id="offline" class="offline" hidden>Reconnecting…</div>
<canvas id="confetti" hidden></canvas>
<script src="/engine.js"></script>
<script src="/learn.js"></script>
<script src="/fair-verify.js"></script>
<script src="/cardparse.js"></script>
<script src="/icons.js"></script>
<script src="/opportunity.js"></script>
<script src="/business.js"></script>
<script src="/app.js"></script>
</body>
</html>
